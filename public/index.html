<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Thankfulness Tree</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="falling" aria-hidden="true"></div>

  <header>
    <p class="eyebrow">Happy Thanksgiving</p>
    <h1>The Thankfulness Tree</h1>
    <p class="sub">Write what you're grateful for. Pangram checks it sounds like a real human wrote it, then your leaf joins the tree.</p>
  </header>

  <main>
    <section class="maker">
      <form id="form" autocomplete="off">
        <label for="gratitude" class="prompt">I am thankful for</label>
        <input id="gratitude" name="gratitude" maxlength="180" placeholder="the smell of pie cooling on the counter" required />
        <button type="submit" id="submit">Grow a leaf</button>
      </form>

      <div class="preview">
        <div class="big-leaf" id="bigLeaf">
          <svg viewBox="0 0 100 120" aria-hidden="true">
            <path class="stem" d="M50 98 Q52 110 47 118" />
            <path class="blade" d="M50 4 C82 22 96 56 50 100 C4 56 18 22 50 4 Z" />
            <path class="vein" d="M50 12 L50 94 M50 40 L33 30 M50 40 L67 30 M50 58 L30 48 M50 58 L70 48 M50 76 L36 68 M50 76 L64 68" />
          </svg>
          <div class="leaf-text">
            <span class="leaf-lead">I am thankful for</span>
            <span class="leaf-body" id="leafBody">...</span>
          </div>
        </div>
        <div class="result" id="result" hidden>
          <div class="score"><span id="scoreNum">0</span><small>% human</small></div>
          <p class="verdict" id="verdict"></p>
          <p class="meta" id="meta"></p>
          <button type="button" id="hang">Hang it on the tree</button>
        </div>
        <p class="error" id="error" hidden></p>
      </div>
    </section>

    <section class="tree-wrap">
      <p class="count" id="count">0 leaves of gratitude</p>
      <div class="tree" id="tree">
        <svg viewBox="0 0 600 600" aria-hidden="true">
          <ellipse cx="300" cy="592" rx="230" ry="22" class="ground" />
          <g class="branches">
            <path d="M295 400 C250 360 200 330 150 300" stroke-width="16" />
            <path d="M305 390 C350 350 410 330 460 290" stroke-width="16" />
            <path d="M300 340 C290 280 300 220 300 150" stroke-width="16" />
            <path d="M292 365 C240 300 205 250 185 180" stroke-width="11" />
            <path d="M308 365 C360 300 400 250 420 185" stroke-width="11" />
            <path d="M150 300 C130 282 110 272 88 270" stroke-width="7" />
            <path d="M460 290 C485 272 505 266 522 263" stroke-width="7" />
            <path d="M300 232 C272 204 252 174 242 130" stroke-width="7" />
            <path d="M300 232 C328 204 348 174 360 130" stroke-width="7" />
            <path d="M210 335 C196 360 180 372 160 378" stroke-width="6" />
            <path d="M392 330 C408 356 424 368 446 374" stroke-width="6" />
          </g>
          <path class="trunk" d="M255 600 C276 520 282 430 293 300 Q300 290 307 300 C318 430 324 520 345 600 Z" />
          <path class="bark" d="M292 560 C296 500 293 450 296 400 M308 520 C305 470 309 430 306 380" />
        </svg>
        <div class="leaves" id="leaves"></div>
        <p class="empty" id="empty">The tree is waiting for its first leaf.</p>
      </div>
      <div class="popover" id="popover" hidden></div>
    </section>
  </main>

  <footer>Humanness scores by <a href="https://www.pangram.com" target="_blank" rel="noopener">Pangram</a></footer>
  <script src="app.js"></script>
</body>
</html>
